<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoTextGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&amp;display=swap');
      .logo-text {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 28px;
        fill: #FFFFFF;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>

  <!-- Icone N-PCB embutido e escalonado (50x50) -->
  <g transform="translate(10, 5) scale(0.5)">
    <!-- Pinos esquerdos -->
    <path d="M12 35H25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M12 45H25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M12 55H25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M12 65H25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Pinos direitos -->
    <path d="M75 35H88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M75 45H88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M75 55H88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M75 65H88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Trilhas verticais superiores -->
    <path d="M40 12V25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M50 12V25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M60 12V25" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Trilhas verticais inferiores -->
    <path d="M40 75V88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M50 75V88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M60 75V88" stroke="url(#logoTextGradWhite)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Moldura -->
    <path d="M28 28H72V72H28Z" stroke="url(#logoTextGradWhite)" stroke-width="5" stroke-linejoin="round"/>

    <!-- O "N" Central -->
    <path d="M36 64V36" stroke="url(#logoTextGradWhite)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M36 36L64 64" stroke="url(#logoTextGradWhite)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M64 64V36" stroke="url(#logoTextGradWhite)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Nós de Solda -->
    <circle cx="36" cy="36" r="4.5" fill="#1A6FD4" stroke="url(#logoTextGradWhite)" stroke-width="2"/>
    <circle cx="36" cy="64" r="4.5" fill="#1A6FD4" stroke="url(#logoTextGradWhite)" stroke-width="2"/>
    <circle cx="64" cy="36" r="4.5" fill="#1A6FD4" stroke="url(#logoTextGradWhite)" stroke-width="2"/>
    <circle cx="64" cy="64" r="4.5" fill="#1A6FD4" stroke="url(#logoTextGradWhite)" stroke-width="2"/>
  </g>

  <!-- Nome NIŌ TECH com fonte Syne Bold e o "Ō" com Macron em branco -->
  <text x="72" y="39" class="logo-text">NIŌ TECH</text>
</svg>
